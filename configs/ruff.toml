target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "node_modules",
    ".claude",
    "vendor",
    "graphify-out",
    "open-review",
    "reports",
    "tools",
]

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "S",     # flake8-bandit (security)
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "I",     # isort
]
ignore = [
    "S101", # assert allowed in tests
    "E501", # line length handled separately
    "S603", # subprocess call without shell=True
    "S607", # start process with partial path
]

[lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"*test*" = ["S101", "S105", "S106"]
"scripts/*" = ["S101", "S105", "S106", "S603", "S607", "S110", "S112", "S608"]
"backend/sandbox/**" = ["S324"]
"docs/*" = ["S110", "S310"]

